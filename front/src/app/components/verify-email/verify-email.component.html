<div class="verify-wrapper">
  <div class="verify-card">

    <div class="email-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40">
        <rect x="4" y="12" width="56" height="40" rx="6" fill="none" stroke="white" stroke-width="3"/>
        <polyline points="4,18 32,38 60,18" fill="none" stroke="white" stroke-width="3"
                  stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="verify-title">Vérifiez votre email</h1>

    <p class="verify-body">
      Un email de confirmation a été envoyé à<br>
      <strong>{{ userEmail }}</strong>
    </p>

    <p class="verify-hint">
      Cliquez sur le lien dans l'email pour activer votre compte.
      Pensez à vérifier vos spams.
    </p>

    <div class="status-row success" *ngIf="verified">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Email vérifié ! Redirection…
    </div>

    <!-- Message d'erreur -->
    <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>

    <div class="actions">
      <button class="btn-resend" (click)="resendEmail()" [disabled]="resendDisabled">
        {{ resendLabel }}
      </button>
      <button class="btn-logout" (click)="onLogout()">
        Se connecter avec un autre compte
      </button>
    </div>

  </div>
</div>
