<div class="login-wrapper">
  <div class="signup-container">

    <!-- Logo -->
    <div class="logo-box">
      <i class="fa-solid fa-plane"></i>
    </div>

    <h1>Bon retour !</h1>
    <p class="subtitle">Connectez-vous pour accéder à votre assistant voyage</p>

    <!-- Message d'erreur global -->
    <div class="error-banner" *ngIf="errorMessage">
      <i class="fa-solid fa-circle-exclamation"></i>
      {{ errorMessage }}
    </div>

    <!-- Formulaire Email / Password -->
    <form [formGroup]="applyForm" (ngSubmit)="login()" novalidate>

      <div class="input-group-custom">
        <i class="fa-solid fa-envelope input-icon"></i>
        <input
          type="email"
          formControlName="email"
          class="form-control-custom"
          [class.is-invalid]="applyForm.get('email')?.invalid && applyForm.get('email')?.touched"
          placeholder="votre@email.com"
          autocomplete="email"
        />
        <span
          class="field-error"
          *ngIf="applyForm.get('email')?.invalid && applyForm.get('email')?.touched"
        >
          Email invalide
        </span>
      </div>

      <div class="input-group-custom">
        <i class="fa-solid fa-lock input-icon"></i>
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          class="form-control-custom"
          [class.is-invalid]="applyForm.get('password')?.invalid && applyForm.get('password')?.touched"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <button type="button" class="toggle-password" (click)="togglePassword()">
          <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
        </button>
        <span
          class="field-error"
          *ngIf="applyForm.get('password')?.invalid && applyForm.get('password')?.touched"
        >
          Minimum 6 caractères
        </span>
      </div>

      <div class="forgot-password">
        <a routerLink="/forgot-password">Mot de passe oublié ?</a>
      </div>

      <button
        type="submit"
        class="btn-primary-custom"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading" class="spinner-wrap">
          <i class="fa-solid fa-circle-notch fa-spin"></i> Connexion…
        </span>
      </button>

    </form>

    <div class="divider"><span>ou</span></div>

       <div class="social-buttons-row">
      <!-- Google -->
      <button
        type="button"
        class="btn-google"
        (click)="loginWithGoogle()"
        [disabled]="isGoogleLoading"
      >
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span *ngIf="!isGoogleLoading">Google</span>
        <span *ngIf="isGoogleLoading">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
        </span>
      </button>

      <!-- Facebook -->
      <button
        type="button"
        class="btn-facebook"
        (click)="loginWithFacebook()"
        [disabled]="isFacebookLoading"
      >
        <i class="fa-brands fa-facebook"></i>
        <span *ngIf="!isFacebookLoading">Facebook</span>
        <span *ngIf="isFacebookLoading">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
        </span>
      </button>
    </div>

        <!-- ✅ NOUVEAU BOUTON INVITÉ -->
    <button
      type="button"
      class="btn-guest"
      (click)="continueAsGuest()"
      [disabled]="isGuestLoading"
    >
      <i class="fa-solid fa-user-astronaut"></i>
      <span *ngIf="!isGuestLoading">Continuer en invité</span>
      <span *ngIf="isGuestLoading">
        <i class="fa-solid fa-circle-notch fa-spin"></i> Connexion...
      </span>
    </button>

    <p class="signin-link">
     Pas encore de compte ?
  <a routerLink="/register"
     [queryParams]="{ tenant: currentTenantId }"
     class="auth-link">
    Créer un compte
  </a>
    </p>

  </div>
</div>
